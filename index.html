<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Evaluator - Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <i class="fas fa-file-alt logo-icon"></i>
                <h1>Resume Evaluator</h1>
                <p>Streamline your hiring process</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>
                
                <div class="role-selection">
                    <p>Select Your Role</p>
                    <div class="role-buttons">
                        <button type="button" class="role-btn" data-role="employee">
                            <i class="fas fa-user"></i>
                            <span>Employee</span>
                        </button>
                        <button type="button" class="role-btn" data-role="company">
                            <i class="fas fa-building"></i>
                            <span>Company Evaluator</span>
                        </button>
                    </div>
                </div>
                
                <button type="submit" class="submit-btn" disabled>
                    Sign In
                </button>
            </form>
            
            <div class="footer-links">
                <a href="#">Forgot Password?</a>
                <span>•</span>
                <a href="#">Create Account</a>
            </div>
        </div>
    </div>
    
    <script src="login.js"></script>
</body>
</html>
